<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>nuzhub</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--canvas); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .brand { fill:var(--emerald); }
  .deep { fill:var(--emerald-deep); }
  .sheen { fill:var(--emerald-sheen); }
  .tint { fill:var(--emerald-soft); }
  .gold { fill:var(--gold); }
  .card { rx:var(--radius-lg); }
  .xl { rx:var(--radius-xl); }
  .words { position:absolute; left:var(--space-12); bottom:var(--space-12); max-width:440px; }
  .name { margin:0; font-size:120px; line-height:.92; font-weight:800; letter-spacing:-.03em; color:var(--emerald-strong); }
  .tag { margin:var(--space-3) 0 0 6px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      emerald-deep 208×272 slab bleeding off the top (the 'shader' green, largest) · emerald 160×176 · emerald-soft 160×80 tint · gold 48-disc once (victory) — ≈30% of 960×288
  arrangement one tall deep slab with satellites, bottoms on one line space-6 above the edge, space-4 gutters, the slab bleeding off the right
  pattern     discs and pills, from "soft and rounded" + "cards that lift": a short run of radius-pill party-slot dots (6, like a team) in emerald-sheen across the deep slab, one cut pill in the emerald block
  scales      sides in space-4 multiples; gutters space-4; dot pitch space-8; corners radius-lg (blocks) and radius-xl (slab); pills and discs rx = half the short side
-->
<rect class="tint card" x="16" y="184" width="160" height="80" rx="18"/>
<rect class="brand card" x="16" y="-8" width="160" height="176" rx="18"/>
<rect class="tint" x="40" y="128" width="64" height="16" rx="8"/>
<rect class="deep xl" x="192" y="-8" width="304" height="272" rx="28"/>
<circle class="sheen" cx="232" cy="200" r="8"/>
<circle class="sheen" cx="264" cy="200" r="8"/>
<circle class="sheen" cx="296" cy="200" r="8"/>
<circle class="sheen" cx="328" cy="200" r="8"/>
<circle class="sheen" cx="360" cy="200" r="8"/>
<circle class="sheen" cx="392" cy="200" r="8" opacity=".35"/>
<rect class="sheen" x="224" y="232" width="112" height="8" rx="4"/>
<circle class="gold" cx="424" cy="64" r="24"/>
</svg>
</div>
<div class="words">
<p class="name">nuzhub</p>
<p class="tag">Track every run. Learn from everyone's.</p>
</div>
</div>
</body>
</html>
