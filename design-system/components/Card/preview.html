<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Card — preview</title></head>
<body>
<div class="nz-stage" style="align-items:stretch">
  <div class="nz-card is-interactive" style="width:240px">
    <p class="nz-card-title">Emerald Kaizo</p>
    <p class="nz-card-meta">Attempt 4 · 6 badges · updated 2h ago</p>
    <div style="display:flex;gap:6px;margin-top:12px"><span class="nz-chip nz-chip-alive"><svg class="nz-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" /> <path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27" /></svg>5 alive</span><span class="nz-chip nz-chip-fainted"><svg class="nz-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12.5 17-.5-1-.5 1h1z" /> <path d="M15 22a1 1 0 0 0 1-1v-1a2 2 0 0 0 1.56-3.25 8 8 0 1 0-11.12 0A2 2 0 0 0 8 20v1a1 1 0 0 0 1 1z" /> <circle cx="15" cy="12" r="1" /> <circle cx="9" cy="12" r="1" /></svg>3 fainted</span></div>
  </div>
  <div class="nz-card nz-card-featured" style="width:240px">
    <p class="nz-card-title">Run complete</p>
    <p class="nz-card-meta">Hall of Fame on attempt 4 — well played.</p>
    <div style="margin-top:12px"><button class="nz-btn nz-btn-sm">Share run</button></div>
  </div>
  <div class="nz-card nz-card-dense" style="width:200px">
    <p class="nz-card-title">Dense card</p>
    <p class="nz-card-meta">space-3 padding for planners</p>
  </div>
</div>
</body>
</html>
